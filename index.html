<!DOCTYPE html>

<head>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #d3cfff;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .ghost-close {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: background-color 0.15s ease;
            text-decoration: none;
        }

        .ghost-close:hover {
            background-color: rgba(0, 0, 0, 0.08);
        }

        .phantom-logo {
            width: 64px;
            height: 52px;
        }

        /* Main Modal Container with purple glow removed */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            position: relative;
            z-index: 5;
        }

        .modal {
            background-color: #0c0c0e;
            width: 435px;
            border-radius: 24px;
            padding: 22px 22px 22px 22px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Pagination Dots moved higher */
        .dots {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            margin-top: -4px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #3f3f46;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #b794f4;
            width: 11px;
            height: 11px;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 13.5px;
            color: #8c8c9e;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
            min-height: 19px;
        }

        /* Screen States */
        .screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 10px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #27272a;
            border-top: 3px solid #b794f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Inputs Container Layout */
        .inputs-container {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-bottom: 14px;
        }

        /* Input Group - More vertical height */
        .input-group {
            position: relative;
            background-color: #141417;
            border: 1px solid #272730;
            border-radius: 9px;
            padding: 0 9px;
            height: 64px;
            display: flex;
            flex-direction: row; 
            align-items: center;
            gap: 5px; 
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Thinner purple outline */
        .input-group:focus-within {
            border-color: #c5bfff;
            box-shadow: 0 0 0 0.5px #c5bfff;
        }

        .input-group.error {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 0.5px #ef4444 !important;
        }

        .input-group label {
            font-size: 14.5px;
            color: #a1a1aa;
            font-weight: 500;
            min-width: 24px;
            line-height: 1;
            user-select: none;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16.5px; 
            outline: none;
            width: 100%;
            line-height: 1.2;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Toggle Phrase Button */
        .toggle-phrase {
            color: #9c9cae;
            background: none;
            border: none;
            font-size: 13.5px;
            cursor: pointer;
            margin-bottom: 14px;
            font-weight: 500;
            transition: color 0.25s ease;
            pointer-events: auto;
        }

        .toggle-phrase:hover {
            color: #b794f4;
        }

        /* Action Buttons */
        .action-btn {
            width: 100%;
            background-color: #1c1c21;
            color: #71717a;
            border: none;
            border-radius: 12px;
            padding: 13.5px;
            font-size: 15.5px;
            font-weight: 600;
            cursor: not-allowed;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .action-btn.active-btn {
            background-color: #b794f4;
            color: #000;
            cursor: pointer;
            pointer-events: auto;
        }

        .action-btn.active-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
