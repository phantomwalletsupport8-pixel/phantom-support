            gap: 6px;
            font-weight: 500;
        }

        /* Main Box Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .card {
            background-color: #121214;

        }

        }

            color: #98989f;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        /* Inputs Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 16px;
        }

        .input-wrapper {
            position: relative;
            background-color: #1a1a1e;
            border: 1px solid #27272f;
            border-radius: 10px;
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            transition: border-color 0.2s;
        }

        .input-wrapper.error {
            border-color: #e5484d;
        }

        .input-wrapper span.index {
            font-size: 12px;
            color: #6c6c75;
            margin-right: 6px;
            user-select: none;
        }

        .input-wrapper input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            width: 100%;
            outline: none;
        }

        .error-message {
            color: #e5484d;
            font-size: 12px;
            width: 100%;
            margin-bottom: 16px;
            min-height: 16px;
            text-align: left;
        }

        .toggle-24 {
            font-size: 13px;
            color: #ab9ff2;
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 24px;
            text-align: center;
        }

        .import-btn {
            background-color: #f4f4f6;
            color: #000;
            border: none;
            width: 100%;
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .import-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .import-btn:not(:disabled):hover {
            background-color: #fff;
        }
    </style>
</head>
