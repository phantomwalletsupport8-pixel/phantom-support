<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #d4d0ff;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .ghost-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            text-decoration: none;
        }

        .ghost {
            width: 52px;
            height: 46px;
            transition: opacity 0.2s ease;
        }

        .ghost path {
            fill: #000000;
            transition: fill 0.2s ease;
        }

        .ghost-link:hover .ghost path {
            fill: #555555;
        }

        .help-link {
            color: #000;
            background: transparent;
            border: none;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0;
            cursor: pointer;
        }

        .help-link svg {
            width: 22px;
            height: 22px;
        }

        .help-link:hover {
            opacity: 0.75;
        }

        /* Main Modal Container */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            position: relative;
            z-index: 5;
        }

        .modal {
            background-color: #0c0c0e;
            width: 435px;
            border-radius: 24px;
            padding: 26px 22px 22px 22px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 15px rgba(183, 148, 244, 0.12);
            border: 1px solid rgba(183, 148, 244, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Pagination Dots */
        .dots {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #3f3f46;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #b794f4;
            width: 11px;
            height: 11px;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 15px;
            color: #a1a1b5;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }

        /* Screen States */
        .screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 10px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #27272a;
            border-top: 3px solid #b794f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Inputs Container Layout */
        .inputs-container {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 14px;
        }

        /* Input Group - Made more vertical */
        .input-group {
            position: relative;
            background-color: #141417;
            border: 1px solid #272730;
            border-radius: 12px;
            padding: 8px 10px;
            height: 64px;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: flex-start;
            gap: 2px; 
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Focused input group outline state */
        .input-group:focus-within {
            border-color: #c5bfff;
            box-shadow: 0 0 0 1px #c5bfff;
        }

        /* Error state outline for misspelled words */
        .input-group.error-state {
            border-color: #ff5c5c !important;
            box-shadow: 0 0 0 1px #ff5c5c !important;
        }

        .input-group label {
            font-size: 12px;
            color: #a1a1aa;
            font-weight: 500;
            line-height: 1;
            user-select: none;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15.5px; 
            outline: none;
            width: 100%;
            line-height: 1.2;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Toggle Phrase Button */
        .toggle-phrase {
            color: #b0b0c4;
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 14px;
            font-weight: 500;
            transition: color 0.25s ease;
            pointer-events: auto;
        }

        .toggle-phrase:hover {
            color: #b794f4;
        }

        /* Action Buttons */
        .action-btn {
            width: 100%;
            background-color: #1c1c21;
            color: #71717a;
            border: none;
            border-radius: 12px;
            padding: 13.5px;
            font-size: 15.5px;
            font-weight: 600;
            cursor: not-allowed;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .action-btn.active-btn {
            background-color: #b794f4;
            color: #000;
            cursor: pointer;
            pointer-events: auto;
        }

        .action-btn.active-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

    <!-- Script Logic -->
    <script>
        let wordCount = 12;
        const welcomeScreen = document.getElementById('welcomeScreen');
        const phraseScreen = document.getElementById('phraseScreen');
        const loadingScreen = document.getElementById('loadingScreen');
        const startBtn = document.getElementById('startBtn');
        const inputsGrid = document.getElementById('inputsGrid');
        const toggleBtn = document.getElementById('toggleBtn');
        const subtitleText = document.getElementById('subtitle-text');
        const importBtn = document.getElementById('importBtn');

        startBtn.onclick = function(e) {
            e.preventDefault();
            welcomeScreen.classList.add('hidden');
            phraseScreen.classList.remove('hidden');
            renderInputs();
        };

        function renderInputs() {
            inputsGrid.innerHTML = '';
            for (let i = 1; i <= wordCount; i++) {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.id = `group-${i}`;
                group.innerHTML = `
                    <label>${i}.</label>
                    <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-index="${i}" id="word-${i}">
                `;
                inputsGrid.appendChild(group);
            }
            checkCompletion();
        }

        toggleBtn.onclick = function(e) {
            e.preventDefault();
            if (wordCount === 12) {
                wordCount = 24;
                toggleBtn.textContent = "I have a 12-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 24-word recovery phrase.";
            } else {
                wordCount = 12;
                toggleBtn.textContent = "I have a 24-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 12 or 24-word recovery phrase.";
            }
            renderInputs();
        };

        function checkCompletion() {
            let allFilled = true;
            for (let i = 1; i <= wordCount; i++) {
                const inputEl = document.getElementById(`word-${i}`);
                if (!inputEl || inputEl.value.trim() === "") {
                    allFilled = false;
                    break;
                }
            }

            if (allFilled) {
                importBtn.classList.add('active-btn');
            } else {
                importBtn.classList.remove('active-btn');
            }
        }

        inputsGrid.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT') {
                checkCompletion();
            }
        });

        importBtn.onclick = function(e) {
            e.preventDefault();
            if (!importBtn.classList.contains('active-btn')) return;

            phraseScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
        };
    </script>
