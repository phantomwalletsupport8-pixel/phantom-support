            background-color: #d8d6eb;

            align-items: center;

        .ghost-close {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
        }

        .ghost-close svg {
            width: 28px;
            height: 28px;
            fill: #000;
        }

        .help-link {
            color: #000;
            background: transparent;
            border: 1px solid #bcbbd3;
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .help-link:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        /* Main Modal Container */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .modal {
            background-color: #0c0c0e;
            width: 460px; /* Slimmer width */
            border-radius: 22px;
            padding: 28px 24px 24px 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Pagination Dots */
        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #3f3f46;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #a855f7;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #fff;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #8c8c9e;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }

        /* Screen States */
        .screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 10px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #27272a;
            border-top: 3px solid #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Inputs Container Layout - Thinner boxes & more vertical alignment */
        .inputs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 14px;
            max-height: 310px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .inputs-container::-webkit-scrollbar {
            width: 4px;
        }
        .inputs-container::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }

        .input-group {
            position: relative;
            background-color: #141417;
            border: 1px solid #232329;
            border-radius: 8px;
            padding: 4px 8px;
            height: 38px; /* Thinner vertical boxes */
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.2s;
        }

        .input-group.error {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
        }

        .input-group label {
            font-size: 9px;
            color: #71717a;
            line-height: 1;
            margin-bottom: 1px;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            outline: none;
            width: 100%;
            line-height: 1.2;
        }

        /* Error Label Text */
        .error-message {
            color: #ef4444;
            font-size: 11px;
            width: 100%;
            margin-bottom: 10px;
            display: none;
            text-align: center;
        }

        /* Toggle Phrase Button */
        .toggle-phrase {
            color: #8c8c9e;
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 14px;
            font-weight: 500;
            transition: color 0.25s ease;
        }

        .toggle-phrase:hover {
            color: #c084fc;
        }

        /* Action Buttons */
        .action-btn {
            width: 100%;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Active purple state when all BIP39 words are correctly entered */
        .action-btn.active-ready {
            background-color: #a855f7;
            color: #000;
        }

        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
