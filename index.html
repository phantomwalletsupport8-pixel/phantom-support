    <style>
        * {

        }

        }

        .modal {
            background-color: #121214;
            width: 500px;

            display: flex;

        /* Pagination Dots */
        .dots {
            display: flex;

        }

            width: 6px;
            height: 6px;
            background-color: #4e4e58;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #ab9ff2;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;

            Help

                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="modal-title">Recovery Phrase</div>
            <div class="modal-subtitle" id="subtitle-text">Import an existing wallet with your 12 or 24-word recovery phrase.</div>

            <div class="inputs-container" id="inputsGrid">
                <!-- Dynamically populated fields via JS -->
            </div>

            <div class="error-message" id="errorMessage">Word 1 is incorrect or misspelled</div>

            <button class="toggle-phrase" id="toggleBtn">I have a 24-word recovery phrase</button>

            <button class="import-btn" id="importBtn">Import Wallet</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Official complete 2048 words BIP39 English List subset / reference list
        const bip39Words = [
            "abandon", "ability", "able", "about", "above", "absent", "absorb", "abstract", "absurd", "abuse", "access", "accident", "account", "accuse", "achieve", "acid", "acoustic", "acquire", "across", "act", "action", "actor", "actress", "actual", "adapt", "add", "addict", "address", "adjust", "admit", "adult", "advance", "advice", "aerobic", "affair", "afford", "afraid", "again", "age", "agent", "agree", "ahead", "aim", "air", "airport", "aisle", "alarm", "album", "alcohol", "alert", "alien", "all", "alley", "allow", "almost", "alone", "alpha", "already", "also", "alter", "always", "amateur", "amazing", "among", "amount", "amused", "analyst"
        ];

        let wordCount = 12;
        const inputsGrid = document.getElementById('inputsGrid');
        const toggleBtn = document.getElementById('toggleBtn');
        const subtitleText = document.getElementById('subtitle-text');
        const errorMessage = document.getElementById('errorMessage');
        const importBtn = document.getElementById('importBtn');

        function renderInputs() {
            inputsGrid.innerHTML = '';
            for (let i = 1; i <= wordCount; i++) {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.id = `group-${i}`;
                group.innerHTML = `
                    <label>${i}.</label>
                    <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-index="${i}" id="word-${i}">
                `;
                inputsGrid.appendChild(group);
            }
        }

        toggleBtn.addEventListener('click', () => {
            if (wordCount === 12) {
                wordCount = 24;
                toggleBtn.textContent = "I have a 12-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 24-word recovery phrase.";
            } else {
                wordCount = 12;
                toggleBtn.textContent = "I have a 24-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 12 or 24-word recovery phrase.";
            }
            renderInputs();
            errorMessage.style.display = 'none';
        });

        // Validation & Import Action Handling
        importBtn.addEventListener('click', () => {
            let hasError = false;
            let firstErrorIndex = null;

            for (let i = 1; i <= wordCount; i++) {
                const inputVal = document.getElementById(`word-${i}`).value.trim().toLowerCase();
                const groupDiv = document.getElementById(`group-${i}`);

                // Check if filled and exists in BIP39 word list database
                if (inputVal === "" || !bip39Words.includes(inputVal)) {
                    groupDiv.classList.add('error');
                    if (!hasError) {
                        firstErrorIndex = i;
                    }
                    hasError = true;
                } else {
                    groupDiv.classList.remove('error');
                }
            }

            if (hasError) {
                errorMessage.textContent = `Word ${firstErrorIndex} is incorrect or misspelled`;
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
                alert("Wallet successfully imported!");
            }
        });

        // Live reset error styling on input typing
        inputsGrid.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT') {
                const index = e.target.getAttribute('data-index');
                document.getElementById(`group-${index}`).classList.remove('error');
                errorMessage.style.display = 'none';
            }
        });

        renderInputs();
    </script>
</body>
